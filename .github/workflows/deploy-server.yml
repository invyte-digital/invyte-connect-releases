name: deploy server

# Manual only: Actions → "deploy server" → Run workflow.
# Applies pending D1 migrations, then deploys the Invyte MCP Worker on the Invyte Digital
# Cloudflare account. Runs here for free Actions minutes; the code comes from the private
# repo through the read-only deploy key. Logs are public: never print a secret.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit of invyte-digital/invyte-connect to deploy
        required: false
        default: main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: invyte-digital/invyte-connect
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.CODE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply invyte-connect --remote
      - name: Deploy Worker
        run: npx wrangler deploy
