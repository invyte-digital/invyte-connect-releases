name: deploy server

# Manual only: Actions → "deploy server" → Run workflow.
# Applies pending D1 migrations, then deploys the Invyte MCP Worker on the Invyte Digital
# Cloudflare account. Runs here for free Actions minutes; the code comes from the private
# repo through the read-only deploy key. Logs are public: never print a secret.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit of invyte-digital/invyte-connect to deploy
        required: false
        default: main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: invyte-digital/invyte-connect
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.CODE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Rights of the shared memory and documents, on a local D1 built from today's data shape.
      # Runs offline; a failure stops the deploy before production is touched.
      - name: Memory and documents test (local)
        if: hashFiles('server/test/run-memory.sh') != ''
        run: npm run test:memory
      # Semantic search index, created once (1024 dimensions for bge-m3, filtered by scope and kind).
      # If the API token cannot manage Vectorize yet, the Worker is deployed without the index:
      # search stays keyword-only until the token gets "Vectorize: Edit" and this runs again.
      - name: Knowledge index (Vectorize)
        id: knowledge
        if: hashFiles('server/src/vectors.ts') != ''
        run: |
          if npx wrangler vectorize get invyte-knowledge-bge-m3 >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif npx wrangler vectorize create invyte-knowledge-bge-m3 --dimensions=1024 --metric=cosine \
            && npx wrangler vectorize create-metadata-index invyte-knowledge-bge-m3 --property-name=scope --type=string \
            && npx wrangler vectorize create-metadata-index invyte-knowledge-bge-m3 --property-name=kind --type=string; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Vectorize unavailable for this API token: deploying with keyword search only."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Without the index
        if: steps.knowledge.outputs.present == 'false'
        run: sed -i '/"vectorize": \[/d' wrangler.jsonc
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply invyte-connect --remote
      - name: Deploy Worker
        run: npx wrangler deploy
      # Worker secrets kept as GitHub secrets of this repo; skipped while not set.
      - name: LinkedIn client secret
        env:
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        if: env.LINKEDIN_CLIENT_SECRET != ''
        run: printf '%s' "$LINKEDIN_CLIENT_SECRET" | npx wrangler secret put LINKEDIN_CLIENT_SECRET
